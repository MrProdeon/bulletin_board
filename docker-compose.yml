services:
  db:
    image: postgres:15-alpine
    container_name: bullettin_board_db
    environment:
      POSTGRES_DB: bulletin_board
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d bulletin_board"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  web:
    depends_on:
      db:
        condition: service_healthy

    build: .

    environment:
      DB_HOST: db
      DB_PORT: 5432

    command: bash -c "python manage.py migrate && python manage.py runserver 0.0.0.0:8000"

    volumes:
      - .:/code
      - static_volume:/code/static

    ports:
      - "8000:8000"

volumes:
  postgres_data:
  static_volume: